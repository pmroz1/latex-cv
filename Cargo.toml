[package]
name = "latex-cv"
version = "0.2.0"
edition = "2021"
description = "Desktop CV builder: edit, save projects locally, and export LaTeX/PDF from multiple templates"
license = "MIT"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
